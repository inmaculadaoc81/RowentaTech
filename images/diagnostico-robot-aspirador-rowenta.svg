<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="t2 d2">
  <title id="t2">Diagnóstico electrónico de robot aspirador Rowenta</title>
  <desc id="d2">Ilustración de una placa electrónica de robot aspirador Rowenta siendo revisada con una lupa</desc>
  <defs>
    <linearGradient id="boardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#232a31"/>
      <stop offset="100%" stop-color="#171b1e"/>
    </linearGradient>
    <linearGradient id="tealGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#17c7ba"/>
      <stop offset="100%" stop-color="#0ea89f"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" rx="28" fill="#eef1ee"/>

  <!-- circuit board -->
  <g transform="translate(190,150)">
    <rect width="760" height="500" rx="26" fill="url(#boardGrad)"/>
    <g stroke="#0ea89f" stroke-width="3" fill="none" opacity="0.55">
      <path d="M60 60 H300 V160 H520"/>
      <path d="M60 180 H180 V320 H420 V420"/>
      <path d="M660 60 V220 H480"/>
      <path d="M700 260 V460 H260 V420"/>
      <path d="M120 460 H360"/>
    </g>
    <g fill="#0ea89f" opacity="0.9">
      <circle cx="60" cy="60" r="7"/>
      <circle cx="300" cy="60" r="7"/>
      <circle cx="300" cy="160" r="7"/>
      <circle cx="520" cy="160" r="7"/>
      <circle cx="60" cy="180" r="7"/>
      <circle cx="180" cy="180" r="7"/>
      <circle cx="180" cy="320" r="7"/>
      <circle cx="420" cy="320" r="7"/>
      <circle cx="660" cy="60" r="7"/>
      <circle cx="660" cy="220" r="7"/>
      <circle cx="480" cy="220" r="7"/>
      <circle cx="700" cy="260" r="7"/>
      <circle cx="700" cy="460" r="7"/>
      <circle cx="260" cy="460" r="7"/>
      <circle cx="260" cy="420" r="7"/>
      <circle cx="120" cy="460" r="7"/>
      <circle cx="360" cy="460" r="7"/>
      <circle cx="420" cy="420" r="7"/>
    </g>
    <g fill="#3a4550">
      <rect x="520" y="300" width="140" height="90" rx="8"/>
      <rect x="120" y="220" width="90" height="60" rx="6"/>
    </g>
    <!-- alert node -->
    <circle cx="590" cy="345" r="14" fill="#e2673f"/>
    <circle cx="590" cy="345" r="26" fill="none" stroke="#e2673f" stroke-width="3" opacity="0.55"/>
  </g>

  <!-- magnifying glass -->
  <g transform="translate(760,300)">
    <circle r="150" fill="rgba(255,255,255,0.06)" stroke="url(#tealGrad2)" stroke-width="14"/>
    <rect x="95" y="105" width="150" height="34" rx="17" transform="rotate(45 95 105)" fill="url(#tealGrad2)"/>
  </g>

  <!-- robot vacuum mini icon corner -->
  <g transform="translate(1010,640)">
    <circle r="70" fill="#1a1c1f"/>
    <circle r="70" fill="none" stroke="#3a4550" stroke-width="2"/>
    <circle r="46" fill="none" stroke="#4d5c6c" stroke-width="1.5" stroke-dasharray="2 8"/>
    <circle cy="-56" r="8" fill="#17c7ba"/>
    <circle r="8" fill="#5c6d7d"/>
  </g>

  <!-- checklist card -->
  <g transform="translate(120,620)">
    <rect width="300" height="120" rx="16" fill="#ffffff" stroke="#dfe3e2" stroke-width="2"/>
    <g fill="none" stroke="#0ea89f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M28 34 L40 46 L64 20"/>
      <path d="M28 66 L40 78 L64 52"/>
      <path d="M28 98 L40 110 L64 84"/>
    </g>
    <g fill="#c9cdd1">
      <rect x="86" y="30" width="180" height="12" rx="6"/>
      <rect x="86" y="62" width="150" height="12" rx="6"/>
      <rect x="86" y="94" width="165" height="12" rx="6"/>
    </g>
  </g>
</svg>
